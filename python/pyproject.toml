[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gluondb"
version = "0.1.0"
description = "Official Python SDK for the GluonDB public API"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "GluonDB" }]
maintainers = [{ name = "GluonDB" }]
requires-python = ">=3.9"
keywords = ["gluondb", "sql", "database", "api", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25",
    "typing-extensions>=4.4",
]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
dev = [
    "datamodel-code-generator==0.76.1",
    "mypy>=1.10",
    "pytest>=8",
]

[project.urls]
Homepage = "https://gluondb.com"
Repository = "https://github.com/gluonDB/gluondb_sdk"
Documentation = "https://docs.gluondb.com"
Changelog = "https://github.com/gluonDB/gluondb_sdk/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/gluonDB/gluondb_sdk/issues"
