name: MCP Bridge Release

on:
  push:
    tags:
      - "mcp-v*"
  workflow_dispatch:

jobs:
  publish-mcp-bridge:
    name: Publish MCP bridge to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: mcp-bridge/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: mcp-bridge

      - name: Build and test MCP bridge
        run: npm run test
        working-directory: mcp-bridge

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
        working-directory: mcp-bridge
